[project]
name = "galaxy-tool-xml-fmt"
version = "0.0.1"
description = "Opinionated formatter for Galaxy tool XML — tier 3 of the galaxy-tool-xml ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Richard Burhans" }]
dependencies = [
    # Tier-1 foundation. Sourced from GitHub until tier 1 is published;
    # see [tool.uv.sources] below. Once published, pin a real version
    # range here and drop the source override.
    "galaxy-tool-xml",
    "click>=8",
    "lxml>=5",
]

[tool.uv.sources]
galaxy-tool-xml = { git = "https://github.com/richard-burhans/galaxy-tool-xml" }

[project.scripts]
galaxy-tool-xml-fmt = "galaxy_tool_xml_fmt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# lxml ships no type information.
module = ["lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
